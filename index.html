<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="预算记账">
  <meta name="description" content="比例式预算记账本：扣除每月固定消费后按工作日/周末/节假日比例拆灵活预算，日历记账。">
  <title>📒 比例式预算记账本</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="wrap">
    <h1>📒 比例式预算记账本 <span class="save-status" id="saveStatus"></span></h1>

    <div class="card">
      <div class="date-row">
        <div><label for="start">开始日期</label><input type="date" id="start"></div>
        <div><label for="end">结束日期</label><input type="date" id="end"></div>
      </div>
      <div class="grid">
        <div><label for="budget">当月预算（元）</label><input type="number" id="budget" inputmode="decimal" placeholder="如 2000"></div>
        <div><label for="rateWork">工作日比例</label><input type="number" id="rateWork" inputmode="decimal" placeholder="如 30" step="any"></div>
        <div><label for="rateWeekend">周末比例</label><input type="number" id="rateWeekend" inputmode="decimal" placeholder="如 100" step="any"></div>
        <div><label for="rateHoliday">节假日比例</label><input type="number" id="rateHoliday" inputmode="decimal" placeholder="如 200" step="any"></div>
      </div>
      <div class="fixed-section">
        <div class="fixed-head">
          <div class="section-title">每月固定消费</div>
          <button class="btn-ghost btn-add-fixed" id="fixedAdd" type="button">＋ 添加</button>
        </div>
        <div id="fixedList"></div>
        <div class="fixed-summary" id="fixedSummary"></div>
      </div>
      <div class="actions">
        <button class="btn-primary" id="gen" type="button">生成预算日历</button>
        <button class="btn-ghost" id="export" type="button">导出 CSV</button>
        <button class="btn-danger" id="reset" type="button">清空全部记录</button>
      </div>
      <div class="hint">💡 每日预算 = 灵活预算按工作日/周末/节假日比例拆分。已内置 2026 法定放假与调休；点日历格子可改当天类型或校正当日总额。</div>
    </div>

    <div class="card" id="summaryCard" hidden>
      <div class="today-balance-box" id="todayBalanceBox"></div>
      <div class="ratebox" id="rateInfo"></div>
      <div class="summary" id="summary"></div>
    </div>

    <div class="card spend-card" id="spendCard" hidden>
      <div class="spend-head">
        <div>
          <div class="spend-title">单次消费</div>
          <div class="spend-sub" id="todaySpendHint">输入金额后点确定，累加到当天消费</div>
        </div>
        <div class="spend-today" id="todaySpendTotal">今天已花 ¥0.00</div>
      </div>
      <div class="spend-row">
        <input id="quickAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="输入金额（元）">
        <button class="btn-primary" id="quickAdd" type="button">确定</button>
      </div>
    </div>

    <div class="card" id="calCard" hidden>
      <div id="calendars"></div>
      <div class="hint">✅ 数据自动保存在本机（可离线使用）。输入数字后稍等，顶部出现「✓ 已保存」即可。建议用 Safari / Chrome「添加到主屏幕」。</div>
    </div>
  </div>

  <div class="sheet-mask" id="sheetMask" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <h2 id="sheetTitle"></h2>
      <p class="sheet-sub" id="sheetSub"></p>
      <div class="type-label">当天类型</div>
      <div class="type-row" id="sheetTypes">
        <button type="button" class="type-btn" data-type="work">工作日</button>
        <button type="button" class="type-btn" data-type="weekend">周末</button>
        <button type="button" class="type-btn" data-type="holiday">节假日</button>
      </div>
      <label for="sheetActual">实际花销（元）</label>
      <input id="sheetActual" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
      <div class="sheet-stats" id="sheetStats"></div>
      <button class="btn-primary sheet-done" id="sheetDone" type="button">完成</button>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
