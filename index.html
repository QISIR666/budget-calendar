<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="预算记账">
  <meta name="description" content="比例式预算记账本：按工作日/周末/节假日比例拆预算，日历记账。">
  <title>📒 比例式预算记账本</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="wrap">
    <h1>📒 比例式预算记账本 <span class="save-status" id="saveStatus"></span></h1>

    <div class="card">
      <div class="grid">
        <div><label for="start">周期开始日期</label><input type="date" id="start"></div>
        <div><label for="end">周期结束日期</label><input type="date" id="end"></div>
        <div><label for="budget">总预算（元）</label><input type="number" id="budget" inputmode="decimal" placeholder="如 2000"></div>
        <div><label for="rateWork">工作日比例</label><input type="number" id="rateWork" inputmode="decimal" placeholder="如 30" step="any"></div>
        <div><label for="rateWeekend">周末比例</label><input type="number" id="rateWeekend" inputmode="decimal" placeholder="如 100" step="any"></div>
        <div><label for="rateHoliday">节假日比例</label><input type="number" id="rateHoliday" inputmode="decimal" placeholder="如 200" step="any"></div>
      </div>
      <div class="grid" style="margin-top:10px;">
        <div>
          <label for="holidays">法定节假日（默认已填 2026）</label>
          <textarea id="holidays" placeholder="默认加载国务院 2026 放假安排"></textarea>
        </div>
        <div>
          <label for="makeup">调休上班日（按工作日，默认已填）</label>
          <textarea id="makeup" placeholder="周末补班日期，按工作日比例"></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="btn-primary" id="gen" type="button">生成预算日历</button>
        <button class="btn-ghost" id="fillHolidays" type="button">恢复法定节假日</button>
        <button class="btn-ghost" id="export" type="button">导出 CSV</button>
        <button class="btn-danger" id="reset" type="button">清空全部记录</button>
      </div>
      <div class="hint">💡 默认已填 2026 法定放假与调休；调休按工作日算。点日历格子可改「工作日 / 周末 / 节假日」并记花销。</div>
    </div>

    <div class="card" id="summaryCard" hidden>
      <div class="today-balance-box" id="todayBalanceBox"></div>
      <div class="ratebox" id="rateInfo"></div>
      <div class="summary" id="summary"></div>
    </div>

    <div class="card" id="calCard" hidden>
      <div id="calendars"></div>
      <div class="hint">✅ 数据自动保存在本机（可离线使用）。输入数字后稍等，顶部出现「✓ 已保存」即可。建议用 Safari / Chrome「添加到主屏幕」。</div>
    </div>
  </div>

  <div class="sheet-mask" id="sheetMask" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <h2 id="sheetTitle"></h2>
      <p class="sheet-sub" id="sheetSub"></p>
      <div class="type-label">当天类型</div>
      <div class="type-row" id="sheetTypes">
        <button type="button" class="type-btn" data-type="work">工作日</button>
        <button type="button" class="type-btn" data-type="weekend">周末</button>
        <button type="button" class="type-btn" data-type="holiday">节假日</button>
      </div>
      <label for="sheetActual">实际花销（元）</label>
      <input id="sheetActual" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
      <div class="sheet-stats" id="sheetStats"></div>
      <button class="btn-primary sheet-done" id="sheetDone" type="button">完成</button>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
